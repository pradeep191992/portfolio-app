<main
    class="relative min-h-screen flex items-center pt-24 bg-background-light dark:bg-background-dark hero-gradient overflow-hidden">
    <div class="absolute inset-0 bg-transparent opacity-10 dark:opacity-5"></div>
    <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-16 items-center py-12 relative z-10">
        <div class="lg:col-span-7 space-y-10">
            <div appScrollAnimate
                class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-primary/10 border border-primary/20 text-primary text-xs font-bold uppercase tracking-widest">
                <span class="flex h-2 w-2 rounded-full bg-primary animate-pulse"></span>
                {{ info.availabilityStatus }}
            </div>
            <div class="space-y-6" appScrollAnimate animationDelay="100ms">
                <h1 class="text-5xl lg:text-7xl font-bold leading-[1.1] tracking-tight text-slate-900 dark:text-white">
                    {{ info.headline }} <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-blue-400">{{
                        info.headlineHighlight }}</span>
                </h1>
                <p class="text-lg lg:text-xl text-slate-700 dark:text-slate-400 max-w-2xl leading-relaxed"
                    [innerHTML]="info.description">
                </p>
            </div>
            <div appScrollAnimate animationDelay="200ms"
                class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 p-6 rounded-2xl max-w-xl shadow-lg dark:shadow-none">
                <div class="flex items-center gap-2 mb-3">
                    <span class="material-symbols-outlined text-primary text-xl">target</span>
                    <h3 class="text-sm font-bold uppercase tracking-widest text-slate-800 dark:text-white">Current Focus
                    </h3>
                </div>
                <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed" [innerHTML]="info.currentFocus">
                </p>
            </div>
            <div class="flex flex-wrap gap-4" appScrollAnimate animationDelay="300ms">
                <div *ngFor="let stat of info.stats" class="flex items-center gap-3 glass-frame px-5 py-3 rounded-2xl">
                    <span class="material-symbols-outlined text-primary">{{ stat.icon }}</span>
                    <div>
                        <p class="text-sm font-bold text-slate-900 dark:text-white">{{ stat.value }}</p>
                        <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">{{ stat.label }}</p>
                    </div>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-8 pt-4" appScrollAnimate animationDelay="400ms">
                <button
                    class="w-full sm:w-auto bg-primary hover:bg-primary/90 text-white px-10 py-4 rounded-2xl font-bold text-lg transition-all accent-glow flex items-center justify-center gap-3 group">
                    Let's Connect
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">send</span>
                </button>
                <a routerLink="/projects"
                    class="group flex items-center gap-3 font-bold text-slate-700 hover:text-primary dark:text-slate-300 dark:hover:text-white transition-colors">
                    View Portfolio
                    <span
                        class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
                </a>
            </div>
        </div>
        <div class="lg:col-span-5 flex justify-center lg:justify-end" appScrollAnimate animationDelay="200ms">
            <div class="relative glowing-aura">
                <div class="relative z-10 p-4 rounded-[2.5rem] glass-frame accent-glow overflow-hidden">
                    <div class="relative rounded-[2rem] overflow-hidden bg-slate-100 dark:bg-slate-900">
                        <img [src]="info.photoUrl" [alt]="info.name"
                            class="w-full max-w-[420px] aspect-[4/5] object-cover transition-all duration-700 hover:scale-105">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-white/90 dark:from-background-dark/90 via-transparent to-transparent">
                        </div>
                        <div class="absolute bottom-8 left-0 right-0 px-6 flex flex-wrap justify-center gap-2">
                            <span *ngFor="let badge of info.techBadges"
                                class="px-3 py-1.5 backdrop-blur-xl rounded-xl text-[10px] font-extrabold text-slate-800 dark:text-white uppercase tracking-tighter"
                                [ngClass]="[badge.colorClass, 'border', badge.borderClass]">
                                {{ badge.name }}
                            </span>
                        </div>
                    </div>
                </div>
                <div class="absolute -top-6 -right-6 w-32 h-32 bg-primary/20 blur-3xl rounded-full"></div>
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-500/10 blur-3xl rounded-full"></div>
            </div>
        </div>
    </div>
</main>

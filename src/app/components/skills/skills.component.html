<section class="bg-background-light dark:bg-background-dark py-24 border-t border-slate-200 dark:border-white/5">
    <div class="max-w-7xl mx-auto px-6">
        <div class="text-center mb-16" appScrollAnimate>
            <h2 class="text-3xl lg:text-5xl font-extrabold text-slate-900 dark:text-white mb-4 tracking-tight">
                Tech <span class="text-primary">Stack</span>
            </h2>
            <p class="text-slate-600 dark:text-slate-400 max-w-xl mx-auto">
                Technologies and tools I use to bring products to life.
            </p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div *ngFor="let cat of skillCategories; let i = index" appScrollAnimate [animationDelay]="(i * 150) + 'ms'"
                class="glass-card p-8 rounded-2xl hover:border-primary/30 transition-all duration-300 group">
                <div class="flex items-center gap-3 mb-6">
                    <div
                        class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
                        <span class="material-symbols-outlined text-primary text-2xl">{{ cat.icon }}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">{{ cat.category }}</h3>
                </div>
                <div class="flex flex-wrap gap-2">
                    <span *ngFor="let skill of cat.skills; let j = index"
                        class="px-3 py-1.5 bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-lg hover:border-primary/40 hover:text-primary transition-all cursor-default">
                        {{ skill }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</section>

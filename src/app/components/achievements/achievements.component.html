<section class="bg-background-light dark:bg-background-dark py-24 border-t border-slate-200 dark:border-white/5">
    <div class="max-w-7xl mx-auto px-6">
        <div class="text-center mb-16" appScrollAnimate>
            <h2 class="text-3xl lg:text-5xl font-extrabold text-slate-900 dark:text-white mb-4 tracking-tight">
                Key <span class="text-primary">Achievements</span>
            </h2>
            <p class="text-slate-600 dark:text-slate-400 max-w-xl mx-auto">
                Milestones that reflect dedication, ownership, and measurable impact.
            </p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div *ngFor="let item of achievements; let i = index" appScrollAnimate [animationDelay]="(i * 150) + 'ms'"
                class="relative glass-card p-8 rounded-2xl hover:border-primary/30 transition-all duration-300 group overflow-hidden">
                <div class="relative z-10">
                    <div
                        class="w-14 h-14 rounded-xl bg-primary/10 flex items-center justify-center mb-6 group-hover:bg-primary/20 transition-colors">
                        <span class="material-symbols-outlined text-primary text-3xl">{{ item.icon }}</span>
                    </div>
                    <h3
                        class="text-lg font-bold text-slate-900 dark:text-white mb-3 group-hover:text-primary transition-colors">
                        {{ item.title }}
                    </h3>
                    <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">{{ item.description }}</p>
                </div>
                <div class="absolute -right-6 -bottom-6 opacity-5 group-hover:opacity-10 transition-opacity">
                    <span class="material-symbols-outlined text-[100px] text-primary">{{ item.icon }}</span>
                </div>
            </div>
        </div>
    </div>
</section>

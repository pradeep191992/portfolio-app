<footer class="bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-white/5 py-12">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
        <div class="flex flex-col items-center md:items-start gap-2">
            <p class="text-slate-500 text-sm font-medium">
                © {{ currentYear }} Pradeep Saini. Senior Front-End Developer.
            </p>
            <div class="flex gap-4">
                <a *ngFor="let link of socialLinks" [href]="link.url"
                    class="text-slate-600 hover:text-primary transition-colors">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path [attr.d]="link.svgPath" />
                    </svg>
                </a>
            </div>
        </div>
        <div class="flex items-center gap-10">
            <a routerLink="/journey"
                class="text-[10px] text-slate-500 hover:text-primary uppercase font-bold tracking-[0.2em] transition-colors">
                Career Journey
            </a>
            <a routerLink="/projects"
                class="text-[10px] text-slate-500 hover:text-primary uppercase font-bold tracking-[0.2em] transition-colors">
                Projects
            </a>
            <a routerLink="/contact"
                class="text-[10px] text-slate-500 hover:text-primary uppercase font-bold tracking-[0.2em] transition-colors">
                Contact
            </a>
        </div>
    </div>
</footer>

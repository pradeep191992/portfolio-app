<nav class="fixed top-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-5xl z-50 transition-all duration-300">
    <div
        class="glass-nav rounded-2xl border border-slate-200/50 dark:border-white/10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.1)] px-4">
        <div class="h-16 flex items-center justify-between">
            <a routerLink="/" class="flex items-center gap-3 cursor-pointer group">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-primary to-blue-600 rounded-xl flex items-center justify-center accent-glow shadow-primary/30 shadow-lg group-hover:scale-105 transition-transform">
                    <span class="text-white font-bold text-lg tracking-tighter">PS</span>
                </div>
                <div class="flex flex-col text-slate-900 dark:text-white">
                    <span
                        class="text-base font-extrabold tracking-tight leading-none group-hover:text-primary transition-colors">Pradeep
                        Saini</span>
                    <span class="text-[9px] text-primary font-bold uppercase tracking-[0.2em] mt-0.5">Consultant</span>
                </div>
            </a>

            <!-- Desktop Nav -->
            <div class="hidden md:flex items-center gap-2">
                <a *ngFor="let link of navLinks" [routerLink]="link.path"
                    routerLinkActive="bg-slate-100/80 dark:bg-white/10 text-slate-900 dark:text-white"
                    [routerLinkActiveOptions]="{exact: link.exact}"
                    class="px-4 py-2 rounded-xl text-sm font-bold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-white/5 transition-all cursor-pointer">
                    {{ link.label }}
                </a>
            </div>

            <div class="flex items-center gap-3">
                <!-- Theme Toggle -->
                <button (click)="themeService.toggleTheme()"
                    class="hidden md:flex items-center justify-center w-10 h-10 rounded-xl hover:bg-slate-100 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all shadow-sm border border-transparent hover:border-slate-200 dark:hover:border-white/5"
                    aria-label="Toggle theme">
                    <span class="material-symbols-outlined text-[20px]">{{ themeService.isDarkMode() ? 'light_mode' :
                        'dark_mode' }}</span>
                </button>

                <button
                    class="bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-100 text-white dark:text-slate-900 px-5 py-2.5 rounded-xl text-sm font-bold transition-transform hover:scale-105 hover:-translate-y-0.5 hidden lg:flex items-center gap-2 shadow-xl shadow-slate-900/20 dark:shadow-white/20">
                    <span class="material-symbols-outlined text-sm">download</span>
                    Resume
                </button>

                <!-- Hamburger Button -->
                <button (click)="toggleMenu()"
                    class="md:hidden flex flex-col items-center justify-center w-10 h-10 rounded-xl hover:bg-slate-100 dark:hover:bg-white/10 transition-colors border border-transparent hover:border-slate-200 dark:hover:border-white/5">
                    <span class="block w-5 h-0.5 bg-slate-700 dark:bg-white transition-all duration-300 rounded-full"
                        [class.rotate-45]="isMenuOpen" [class.translate-y-[6px]]="isMenuOpen"></span>
                    <span
                        class="block w-5 h-0.5 bg-slate-700 dark:bg-white mt-1 transition-all duration-300 rounded-full"
                        [class.opacity-0]="isMenuOpen"></span>
                    <span
                        class="block w-5 h-0.5 bg-slate-700 dark:bg-white mt-1 transition-all duration-300 rounded-full"
                        [class.-rotate-45]="isMenuOpen" [class.-translate-y-[6px]]="isMenuOpen"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div class="md:hidden absolute top-[4.5rem] left-0 w-full overflow-hidden transition-all duration-300 ease-in-out"
        [class.max-h-0]="!isMenuOpen" [class.max-h-[30rem]]="isMenuOpen" [class.opacity-0]="!isMenuOpen"
        [class.opacity-100]="isMenuOpen" [class.invisible]="!isMenuOpen">

        <div
            class="glass-nav rounded-2xl border border-slate-200/50 dark:border-white/10 shadow-2xl shadow-slate-900/10 dark:shadow-black/50 p-4 mt-2">
            <div class="space-y-1">
                <a *ngFor="let link of navLinks" [routerLink]="link.path"
                    routerLinkActive="bg-primary/10 text-primary dark:bg-primary/20"
                    [routerLinkActiveOptions]="{exact: link.exact}" (click)="isMenuOpen = false"
                    class="block py-3.5 px-4 text-sm font-bold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-white/5 rounded-xl transition-all cursor-pointer">
                    {{ link.label }}
                </a>
            </div>

            <div
                class="pt-4 mt-2 border-t border-slate-200/50 dark:border-white/10 flex items-center justify-between px-4">
                <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Theme</span>
                <button (click)="themeService.toggleTheme()"
                    class="flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 text-slate-700 dark:text-slate-300 transition-colors">
                    <span class="material-symbols-outlined text-[20px]">{{ themeService.isDarkMode() ? 'light_mode' :
                        'dark_mode' }}</span>
                </button>
            </div>

            <div class="pt-4 pb-2 px-2">
                <button
                    class="w-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-slate-100 px-6 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-slate-900/20 dark:shadow-white/20">
                    <span class="material-symbols-outlined text-[18px]">download</span>
                    Download Resume
                </button>
            </div>
        </div>
    </div>
</nav>
